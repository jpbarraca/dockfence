{% extends "base.html" %}
{% block content %}
<div class="card narrow">
  <h1>Sign in</h1>
  <p>Enter the API token (printed to the container logs at first start, or set <code>FW_TOKEN</code>).</p>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="password" name="token" placeholder="token" autofocus required>
    <button type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
